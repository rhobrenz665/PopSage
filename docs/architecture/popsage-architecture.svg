<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="820" viewBox="0 0 1400 820" role="img" aria-labelledby="title desc">
  <title id="title">PopSage v1 system architecture</title>
  <desc id="desc">A simple diagram showing the website widget and dashboard, Next.js orchestration, Neon data services, Cloudflare realtime and AI, Trigger.dev jobs, and future OpenAI adapters.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#64748b"/></marker>
    <style>
      .bg{fill:#f8fafc}.group{fill:#fff;stroke:#cbd5e1;stroke-width:2}.client{fill:#ede9fe;stroke:#7c3aed}.server{fill:#dcfce7;stroke:#16a34a}.data{fill:#dbeafe;stroke:#2563eb}.edge{fill:#fef3c7;stroke:#d97706}.future{fill:#f1f5f9;stroke:#64748b;stroke-dasharray:8 6}.node{stroke-width:2;rx:16}.line{fill:none;stroke:#64748b;stroke-width:2.5;marker-end:url(#arrow)}.dash{stroke-dasharray:8 6}.title{font:700 30px system-ui,sans-serif;fill:#0f172a}.group-title{font:700 18px system-ui,sans-serif;fill:#334155}.label{font:700 18px system-ui,sans-serif;fill:#0f172a;text-anchor:middle}.sub{font:400 14px system-ui,sans-serif;fill:#475569;text-anchor:middle}.edge-label{font:500 13px system-ui,sans-serif;fill:#475569;text-anchor:middle}.note{font:500 15px system-ui,sans-serif;fill:#334155}
    </style>
  </defs>
  <rect class="bg" width="1400" height="820"/>
  <text class="title" x="50" y="55">PopSage v1 — system architecture</text>

  <rect class="group" x="40" y="95" width="300" height="610" rx="22"/>
  <text class="group-title" x="65" y="130">Client surfaces</text>
  <rect class="node client" x="75" y="180" width="230" height="95"/>
  <text class="label" x="190" y="220">Website loader</text><text class="sub" x="190" y="246">visitor session + iframe</text>
  <rect class="node client" x="75" y="340" width="230" height="95"/>
  <text class="label" x="190" y="380">Chat widget</text><text class="sub" x="190" y="406">visitor messaging</text>
  <rect class="node client" x="75" y="520" width="230" height="95"/>
  <text class="label" x="190" y="560">Team dashboard</text><text class="sub" x="190" y="586">owner + teammates</text>
  <path class="line" d="M190 275 L190 340"/>

  <rect class="group" x="390" y="95" width="300" height="610" rx="22"/>
  <text class="group-title" x="415" y="130">Application layer</text>
  <rect class="node server" x="425" y="220" width="230" height="135"/>
  <text class="label" x="540" y="265">Next.js API</text><text class="sub" x="540" y="292">authorization + orchestration</text><text class="sub" x="540" y="316">server-side SQL</text>
  <rect class="node server" x="425" y="450" width="230" height="110"/>
  <text class="label" x="540" y="490">Outbox publisher</text><text class="sub" x="540" y="516">post-commit realtime events</text>

  <rect class="group" x="740" y="95" width="620" height="610" rx="22"/>
  <text class="group-title" x="765" y="130">Managed services — free tier initially</text>
  <rect class="node data" x="780" y="175" width="250" height="95"/>
  <text class="label" x="905" y="214">Neon Auth</text><text class="sub" x="905" y="240">login + sessions</text>
  <rect class="node data" x="1070" y="175" width="250" height="95"/>
  <text class="label" x="1195" y="214">Postgres + pgvector</text><text class="sub" x="1195" y="240">authoritative workspace data</text>
  <rect class="node data" x="780" y="330" width="250" height="95"/>
  <text class="label" x="905" y="369">Neon Object Storage</text><text class="sub" x="905" y="395">private uploaded documents</text>
  <rect class="node edge" x="1070" y="330" width="250" height="95"/>
  <text class="label" x="1195" y="369">PartyServer</text><text class="sub" x="1195" y="395">authorized realtime rooms</text>
  <rect class="node edge" x="780" y="485" width="250" height="95"/>
  <text class="label" x="905" y="524">Workers AI</text><text class="sub" x="905" y="550">classify + generate + embed</text>
  <rect class="node edge" x="1070" y="485" width="250" height="95"/>
  <text class="label" x="1195" y="524">Trigger.dev</text><text class="sub" x="1195" y="550">ingestion + lifecycle jobs</text>

  <path class="line" d="M305 387 C350 387 375 287 425 287"/><text class="edge-label" x="365" y="330">HTTPS</text>
  <path class="line" d="M305 567 C350 567 375 320 425 320"/>
  <path class="line" d="M655 258 L780 223"/><text class="edge-label" x="715" y="225">sessions</text>
  <path class="line" d="M655 290 L1070 223"/><text class="edge-label" x="855" y="244">SQL transactions — no Data API</text>
  <path class="line" d="M655 310 L780 377"/><text class="edge-label" x="715" y="360">uploads</text>
  <path class="line" d="M655 337 L780 532"/><text class="edge-label" x="700" y="450">AI</text>
  <path class="line" d="M1195 270 L1195 330"/><text class="edge-label" x="1270" y="305">outbox events</text>
  <path class="line" d="M1070 377 C840 377 760 505 655 505"/>
  <path class="line" d="M425 505 C365 505 350 405 305 405"/><text class="edge-label" x="365" y="470">live events</text>
  <path class="line" d="M1070 532 C1040 532 1035 400 1030 400"/>
  <path class="line" d="M1195 485 L1195 270"/>

  <rect class="node future" x="900" y="735" width="330" height="60"/>
  <text class="label" x="1065" y="763">OpenAI adapters — future, inactive</text><text class="sub" x="1065" y="784">configuration-based provider switching</text>
  <path class="line dash" d="M905 580 L1005 735"/>
  <text class="note" x="50" y="765">Postgres is authoritative. Realtime is delivery only. Workspace authorization and RLS apply at every data boundary.</text>
</svg>
